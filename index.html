<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rongdhanu Fashion - থ্রিপিস কালেকশন</title>
    <style>
        body {
            font-family: 'SolaimanLipi', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #f57224;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: 0.3s;
            text-align: center;
            padding-bottom: 15px;
        }
        .product-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .product-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        .product-title {
            font-size: 16px;
            color: #333;
            margin: 15px 10px 10px 10px;
        }
        .product-price {
            color: #f57224;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .buy-btn {
            background-color: #f57224;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .buy-btn:hover {
            background-color: #d45b1b;
        }
    </style>
</head>
<body>

    <header>
        রংধনু ফ্যাশন (Rongdhanu Fashion)
    </header>

    <div class="container">
        <div class="product-grid">
            
            <!-- প্রডাক্ট ১ -->
            <div class="product-card">
                <img src="IMG-20261025-WA0036.jpg" alt="থ্রিপিস">
                <div class="product-title">স্টাইলিশ এক্সক্লুসিভ থ্রিপিস</div>
                <div class="product-price">৳ ১,৫৫০</div>
                <button class="buy-btn">অর্ডার করুন</button>
            </div>

            <!-- প্রডাক্ট ২ -->
            <div class="product-card">
                <img src="IMG-20261025-WA0006.jpg" alt="থ্রিপিস">
                <div class="product-title">ফ্যাশনেবল প্রিমিয়াম থ্রিপিস</div>
                <div class="product-price">৳ ১,৬৫০</div>
                <button class="buy-btn">অর্ডার করুন</button>
            </div>

            <!-- প্রডাক্ট ৩ -->
            <div class="product-card">
                <img src="IMG-20261025-WA0010.jpg" alt="থ্রিপিস">
                <div class="product-title">আকর্ষণীয় ডিজাইনের থ্রিপিস</div>
                <div class="product-price">৳ ১,৮০০</div>
                <button class="buy-btn">অর্ডার করুন</button>
            </div>

            <!-- প্রডাক্ট ৪ -->
            <div class="product-card">
                <img src="IMG-20261025-WA0013.jpg" alt="থ্রিপিস">
                <div class="product-title">নরম ও আরামদায়ক সুতি থ্রিপিস</div>
                <div class="product-price">৳ ১,৪০০</div>
                <button class="buy-btn">অর্ডার করুন</button>
            </div>

            <!-- প্রডাক্ট ৫ -->
            <div class="product-card">
                <img src="IMG-20261025-WA0011.jpg" alt="থ্রিপিস">
                <div class="product-title">পার্টি ওয়্যার এমব্রয়ডারি থ্রিপিস</div>
                <div class="product-price">৳ ২,২০০</div>
                <button class="buy-btn">অর্ডার করুন</button>
            </div>

            <!-- প্রডাক্ট ৬ -->
            <div class="product-card">
                <img src="IMG-20261025-WA0024.jpg" alt="থ্রিপিস">
                <div class="product-title">ক্ল্যাসিক কালেকশন থ্রিপিস</div>
                <div class="product-price">৳ ১,৭৫০</div>
                <button class="buy-btn">অর্ডার করুন</button>
            </div>

        </div>
    </div>

</body>
</html>
